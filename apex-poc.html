<script>
// Permanent link: this stub never changes, so a cached copy is harmless. It always pulls the
// latest app (apex-poc-app.html) past the browser / GitHub Pages cache and renders it in place.
(function () {
  var app = 'apex-poc-app.html';
  fetch(app + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () { location.replace(app + '?t=' + Date.now()); });
})();
</script>
